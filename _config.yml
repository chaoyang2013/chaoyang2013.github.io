title: Chao Yang's Homepage
logo: "/assets/images/logo.png"

collections:
  notes:
    output: true


defaults:
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "note"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"


plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag



markdown: kramdown
kramdown:
  input: GFM  # 或默认